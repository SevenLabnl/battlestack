name: Release

# Manual dispatch only. Merging to `main` publishes nothing; a release is always
# a deliberate act by a human, gated a second time by the `release` environment.
#
# Order of operations: gate, then publish, then record. The npm registry is the
# only irreversible step, so git is never marked as released until npm accepted
# the packages. A `v*` tag in this repo therefore always means "published".
#
# `pnpm publish`, never `npm publish`: the packages depend on each other with
# `workspace:*`, and only pnpm rewrites that to a real version at pack time. npm
# would upload tarballs nobody can install.
#
# `-r` publishes every workspace package in dependency order and skips any whose
# version is already on the registry, so a re-run after a partial failure
# finishes the job instead of erroring on the ones that made it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate and pack the tarballs, but publish nothing'
        type: boolean
        default: true
      channel:
        description: 'npm dist-tag. auto = latest for a stable version, the prerelease id otherwise'
        type: choice
        default: auto
        options:
          - auto
          - latest
          - next

permissions:
  contents: read

# Dry runs and publishes get separate groups: a publish parked on its
# environment approval would otherwise hold the group for days and starve every
# dry run queued behind it (GitHub also cancels all but the newest queued run
# in a group). A dry run writes nothing, so running beside a publish is safe.
concurrency:
  group: ${{ inputs.dry_run && 'release-dry-run' || 'release' }}
  cancel-in-progress: false

env:
  PRODUCTION_BRANCH: production
  RELEASE_BRANCH: main

jobs:
  # No environment on this job: the gates must be green before a human is asked
  # to approve anything.
  verify:
    name: Gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # No `registry-url` here on purpose: it would write an .npmrc line that
      # dereferences ${NODE_AUTH_TOKEN}, and with trusted publishing no such
      # token is ever set, so the publish would die on env replacement. OIDC
      # needs no .npmrc auth at all.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A publish from a topic branch would put unreviewed code on the registry
      # under a version `main` does not carry. Dry runs stay unrestricted.
      - name: Verify the release branch
        if: inputs.dry_run != true
        run: |
          if [ "${GITHUB_REF_NAME}" != "${RELEASE_BRANCH}" ]; then
            echo "::error::a real publish must be dispatched from ${RELEASE_BRANCH}, got ${GITHUB_REF_NAME}"
            exit 1
          fi

      # Replaces the old tag-versus-package comparison. There is no hand-written
      # tag to disagree with any more: the version comes from the workspace and
      # this job is what proves all five packages state the same one.
      - name: Verify lockstep versions
        run: node scripts/release-version.mjs --check

      - name: Plan the release
        id: plan
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION=$(node scripts/release-version.mjs --print)

          # Fatal for a publish; informational for a dry run, which is a
          # rehearsal of the gates and must keep working after the release
          # ships (the steady state on main is "current version is tagged").
          if [ -n "$(git tag --list "v$VERSION")" ]; then
            if [ "$DRY" = "true" ]; then
              echo "::warning::tag v$VERSION already exists; a real publish would stop here. The dry run continues."
            else
              echo "::error::tag v$VERSION already exists, so v$VERSION is already released. Run Prepare release first."
              exit 1
            fi
          fi

          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            PREID="${VERSION#*-}"
            DEFAULT_TAG="${PREID%%.*}"
          else
            PRERELEASE=false
            DEFAULT_TAG=latest
          fi

          case "${{ inputs.channel }}" in
            auto) DIST_TAG="$DEFAULT_TAG" ;;
            *)    DIST_TAG="${{ inputs.channel }}" ;;
          esac

          # npm refuses a dist-tag it can parse as a semver version or range
          # ("Tag name must not be a valid SemVer range"), but only at publish
          # time — after the human approved. A version like 0.2.0-0.0 (set by
          # hand; --bump rejects numeric preids) would derive DIST_TAG=0 here.
          if [[ "$DIST_TAG" =~ ^v?[0-9] ]]; then
            echo "::error::\"$DIST_TAG\" is not a valid npm dist-tag (npm reads it as a version). Use a prerelease identifier that starts with a letter."
            exit 1
          fi

          if [ "$PRERELEASE" = true ] && [ "$DIST_TAG" = latest ]; then
            echo "::error::$VERSION is a prerelease; publishing it as latest would serve it to every plain install"
            exit 1
          fi

          # `production` tracks what a plain `npx battlestack` installs, so a
          # prerelease or an off-channel publish leaves it where it is.
          PROMOTE=false
          if [ "$DIST_TAG" = latest ]; then PROMOTE=true; fi

          {
            echo "version=$VERSION"
            echo "dist_tag=$DIST_TAG"
            echo "prerelease=$PRERELEASE"
            echo "promote=$PROMOTE"
          } >> "$GITHUB_OUTPUT"

          echo "### Release plan" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$VERSION\` |"
            echo "| npm dist-tag | \`$DIST_TAG\` |"
            echo "| git tag | \`v$VERSION\` |"
            echo "| promotes \`$PRODUCTION_BRANCH\` | $PROMOTE |"
            echo "| dry run | ${{ inputs.dry_run }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # An already-published version makes `pnpm -r publish` a silent no-op that
      # would still get tagged and promoted. The unscoped wrapper is published
      # last, so it being present means the whole release already landed; a
      # partial set is reported but still resumable.
      - name: Verify the version is unpublished
        env:
          DRY: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          VERSION="${{ steps.plan.outputs.version }}"
          PUBLISHED=0
          while read -r NAME; do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "$NAME@$VERSION is already on npm"
              PUBLISHED=$((PUBLISHED + 1))
            else
              echo "$NAME@$VERSION is not on the registry"
            fi
          done < <(node scripts/release-version.mjs --names)

          if npm view "battlestack@$VERSION" version >/dev/null 2>&1; then
            if [ "$DRY" = "true" ]; then
              echo "::warning::battlestack@$VERSION is already on npm; a real publish would stop here. The dry run continues."
            elif [ -z "$(git tag --list "v$VERSION")" ]; then
              # The wrapper publishes last, so it being on npm means the whole
              # release landed — and the missing tag means only the bookkeeping
              # failed. Re-preparing here would orphan v$VERSION forever.
              echo "::error::battlestack@$VERSION is fully published but v$VERSION was never tagged: the publish succeeded and only the tag/promote failed. Do NOT run Prepare release — recover per RELEASING.md: push the v$VERSION tag from the release commit, then fast-forward production."
              exit 1
            else
              echo "::error::battlestack@$VERSION is already on npm, v$VERSION is spent. Run Prepare release."
              exit 1
            fi
          fi
          if [ "$PUBLISHED" -gt 0 ]; then
            echo "::warning::$PUBLISHED package(s) at $VERSION are already published; this run resumes the rest"
          fi

      # Being unpublished is not enough. `pnpm publish --tag <t>` moves that
      # dist-tag to whatever it is handed, including a version older than the
      # one already there, and the only step that would notice is the
      # `production` fast-forward at the very end of the publish job, long after
      # npm accepted it. Checked here for whichever dist-tag this release
      # targets — `next` can move backwards exactly like `latest`.
      - name: Verify the version moves the dist-tag forward
        env:
          RELEASING: ${{ steps.plan.outputs.version }}
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Fail closed: battlestack is published, so an error from npm must
          # not be mistaken for "first release" — only a clean E404 may be.
          if OUT=$(npm view battlestack "dist-tags.$DIST_TAG" 2>&1); then
            CURRENT=$(echo "$OUT" | tr -d '[:space:]')
          elif echo "$OUT" | grep -q 'E404'; then
            CURRENT=""
          else
            echo "::error::npm view failed while reading dist-tags.$DIST_TAG; refusing to assume this is the first release"
            echo "$OUT"
            exit 1
          fi

          if [ -z "$CURRENT" ]; then
            echo "dist-tag $DIST_TAG has no published version yet, nothing to move backwards"
            exit 0
          fi
          echo "npm $DIST_TAG is $CURRENT, releasing $RELEASING"
          if [ "$DRY" = "true" ]; then
            node scripts/release-version.mjs --newer-than "$CURRENT" \
              || echo "::warning::a real publish would stop here. The dry run continues."
          else
            node scripts/release-version.mjs --newer-than "$CURRENT"
          fi

      # The gates run before the publish, not after: an unpublish window is 72
      # hours and a bad version number is permanent, so it is far cheaper to
      # fail here than to ship and retract.
      - name: Type-check
        run: pnpm tsc

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Proves the tarballs install and the binary runs, from the packed
      # artifacts rather than the workspace. This is the check that would catch
      # a `workspace:*` that failed to rewrite.
      - name: Smoke-test the packed tarballs
        run: node scripts/pack-smoke.mjs

      # The dry run lives here rather than in `publish`, because `publish`
      # carries `environment: release`: its required reviewers would make every
      # dry run wait for a human, and its `main`-only deployment branches would
      # fail a dry run dispatched from a topic branch outright. Both contradict
      # the promise that a dry run needs no approval and runs from any branch.
      - name: Dry run (no publish)
        if: inputs.dry_run == true
        env:
          DIST_TAG: ${{ steps.plan.outputs.dist_tag }}
        run: pnpm -r publish --access public --tag "$DIST_TAG" --no-git-checks --dry-run

  # `environment: release` is the approval gate: configure it with required
  # reviewers, and restrict its deployment branches to `main`. That setting is
  # also what npm Trusted Publishing binds to.
  #
  # `id-token: write` is what lets the job mint a GitHub OIDC token. Auth is npm
  # Trusted Publishing: every package on npmjs.com is configured (Settings ->
  # Trusted Publisher) to accept publishes only from this repo + this workflow
  # file + the `release` environment. pnpm exchanges the OIDC token for a
  # short-lived registry credential at publish time, so no NPM_TOKEN exists.
  #
  # `contents: write` is for the tag and the production branch, nothing else.
  publish:
    name: Publish to npm
    needs: verify
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      PROMOTE: ${{ needs.verify.outputs.promote }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish
        run: pnpm -r publish --access public --tag "$DIST_TAG" --no-git-checks --report-summary

      - name: Upload the publish summary
        if: always() && hashFiles('pnpm-publish-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: publish-summary
          path: pnpm-publish-summary.json

      # Written only now, so the tag is evidence of a completed publish rather
      # than an intention to publish. The message records every package version
      # in the release, which is what makes a checkout of the tag readable
      # without consulting the registry.
      - name: Tag the release
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          {
            echo "battlestack v$VERSION"
            echo
            echo "npm dist-tag: $DIST_TAG"
            echo
            node scripts/release-version.mjs --check | tail -n +2
          } > /tmp/tag-message
          git tag -a "v$VERSION" -F /tmp/tag-message
          git push origin "refs/tags/v$VERSION"

      # Fast-forwards for as long as releases are cut from `main`. A rejected
      # push means the branches diverged and wants a human, not a force.
      - name: Promote the production branch
        if: needs.verify.outputs.promote == 'true'
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$PRODUCTION_BRANCH"
          echo "$PRODUCTION_BRANCH now points at $(git rev-parse --short HEAD) (v$VERSION)"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FLAGS=(--generate-notes --target "$GITHUB_SHA" --title "v$VERSION")
          if [ "$PRERELEASE" = true ]; then
            FLAGS+=(--prerelease)
          fi
          # Keyed on `promote`, not on `prerelease`. A stable version published
          # to `next` leaves npm's `latest` and the production branch alone, so
          # marking it "Latest" on the releases page would advertise a version
          # that no plain `npx battlestack` installs.
          if [ "$PROMOTE" = true ]; then
            FLAGS+=(--latest)
          else
            FLAGS+=(--latest=false)
          fi
          gh release create "v$VERSION" "${FLAGS[@]}"

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Released"
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$VERSION\` |"
            echo "| install | \`npx battlestack@$DIST_TAG\` |"
            echo "| git tag | \`v$VERSION\` |"
            echo "| $PRODUCTION_BRANCH promoted | $PROMOTE |"
          } >> "$GITHUB_STEP_SUMMARY"
