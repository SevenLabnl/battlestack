version: 2
updates:
  # This repo's own dev tooling. Not the npm payload under
  # packages/preset-nuxt4/templates/, which is copied verbatim into generated
  # projects and is versioned by the features that emit it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "typescript"
          - "tsx"
          - "vitest"
          - "@types/*"
    commit-message:
      prefix: "chore(deps)"
    # Tooling updates are listed under the release's Commits; they need no hand-written entry.
    labels: ["dependencies", "javascript", "skip-changelog"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github_actions", "skip-changelog"]

  # The digest-pinned base image the scaffold emits. The dependabot-bump workflow adds the
  # `shared:docker` bump and a changelog line these PRs need.
  - package-ecosystem: docker
    directory: /packages/preset-nuxt4/templates/docker
    schedule:
      interval: weekly
    ignore:
      # Stay on the 24 LTS line; a major Node move is a deliberate template change.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "fix(docker)"
