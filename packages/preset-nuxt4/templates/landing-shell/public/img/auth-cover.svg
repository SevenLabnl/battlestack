<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" role="img" aria-hidden="true">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="oklch(0.55 0.20 260)" />
            <stop offset="100%" stop-color="oklch(0.35 0.18 290)" />
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.35" r="0.55">
            <stop offset="0%" stop-color="rgba(255,255,255,0.35)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
        </radialGradient>
        <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.55)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
        </linearGradient>
    </defs>

    <rect width="600" height="800" fill="url(#bg)" />
    <rect width="600" height="800" fill="url(#glow)" />

    <g fill="none" stroke="url(#ring)" stroke-width="1.5" opacity="0.45">
        <circle cx="300" cy="300" r="120" />
        <circle cx="300" cy="300" r="180" />
        <circle cx="300" cy="300" r="240" />
        <circle cx="300" cy="300" r="320" />
    </g>

    <g transform="translate(300 300)" fill="rgba(255,255,255,0.85)">
        <path d="M0 -60 L52 -30 L52 30 L0 60 L-52 30 L-52 -30 Z" opacity="0.95" />
        <path d="M0 -40 L34 -20 L34 20 L0 40 L-34 20 L-34 -20 Z" fill="oklch(0.55 0.20 260)" />
        <path
            d="M-16 -4 L-4 8 L16 -12"
            stroke="rgba(255,255,255,0.95)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
        />
    </g>

    <g fill="rgba(255,255,255,0.55)">
        <circle cx="80" cy="120" r="3" />
        <circle cx="520" cy="180" r="2" />
        <circle cx="140" cy="640" r="2.5" />
        <circle cx="480" cy="680" r="3" />
        <circle cx="200" cy="220" r="1.5" />
        <circle cx="420" cy="560" r="1.5" />
    </g>
</svg>
