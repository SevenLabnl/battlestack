name: Lint, Test & SonarQube

on:
  push:
    branches: [main, staging, development]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 11 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test & analyse
    # Defaults to a GitHub-hosted runner so this works with zero configuration.
    # Set the repo/org variable `CI_RUNNER` to a self-hosted runner label to point this job at your own fleet, no template edit needed.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Some minimal self-hosted runner images lack packages ubuntu-latest already has (e.g. `libatomic1`, needed by a package manager's bundled binary).
      # Set the repo/org variable `CI_RUNNER_APT_PACKAGES` (space-separated) to install what's missing; unset (default) skips this step entirely.
      - name: Install extra runner packages
        if: vars.CI_RUNNER_APT_PACKAGES != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ vars.CI_RUNNER_APT_PACKAGES }}

      # Setup step, cache key and commands are regenerated by `battlestack pull` for this project's package manager; edit them freely, nothing re-derives itself behind your back.
      # Switching manager? Change all three together: bun needs `oven-sh/setup-bun` and NO `cache:` key (`actions/setup-node` doesn't accept one for bun and the job fails if given it).
__PM_SETUP__

      - uses: actions/setup-node@v6
        with:
          node-version: 24
__PM_CACHE__

      - name: Install dependencies
        run: __PM_INSTALL__

      - name: Lint
        run: |
          __PM_EXEC__ nuxi prepare
          __PM_RUN__ lint

      - name: Typecheck
        run: __PM_RUN__ typecheck

      - name: Test with coverage
        run: __PM_RUN__ test:coverage

      # Two layers, both needing no setup: no server, no credentials, no network beyond the registry.
      # A scan needing config a fork can't supply never runs, which reads as coverage without being coverage.

      # Layer 1: advisory, never blocking. An unpinned tree carries advisories this project cannot clear, so failing on them
      # would redden every fork's first push. To gate instead: pin the tree, add `--audit-level=critical`, drop `continue-on-error`.
      - name: Audit dependencies (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          __PM_AUDIT__ --json > "$RUNNER_TEMP/audit.json" || true
          node -e '
            const fs = require("node:fs")
            const order = ["critical", "high", "moderate", "low", "info"]
            const zero = () => Object.fromEntries(order.map((k) => [k, 0]))
            let counts = null
            let empty = false
            try {
              const text = fs.readFileSync(process.env.RUNNER_TEMP + "/audit.json", "utf8").trim()
              if (!text) {
                empty = true
              } else {
                const raw = JSON.parse(text)
                const meta = raw && raw.metadata && raw.metadata.vulnerabilities
                if (meta) {
                  // pnpm and npm: { metadata: { vulnerabilities: { critical, high, ... } } }
                  counts = zero()
                  for (const k of order) counts[k] = meta[k] || 0
                } else if (raw && typeof raw === "object") {
                  // bun: { "<package>": [ { severity }, ... ] }, no metadata block
                  counts = zero()
                  for (const list of Object.values(raw)) {
                    for (const a of Array.isArray(list) ? list : []) {
                      if (a && counts[a.severity] !== undefined) counts[a.severity]++
                    }
                  }
                }
              }
            } catch {}
            const total = counts && order.reduce((n, k) => n + counts[k], 0)
            const body = empty
              ? "The audit produced no output: either it found nothing, or it failed. Check the step log."
              : counts === null
                ? "Could not parse the audit report. Check the step log."
                : total === 0
                  ? "No known advisories."
                  : order.filter((k) => counts[k]).map((k) => `- **${counts[k]}** ${k}`).join("\n")
            const note =
              "\n\nAdvisory only: this step does not fail the build. Vulnerabilities " +
              "*introduced by a pull request* are blocked separately by the dependency-review step."
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `## Dependency audit (advisory)\n\n${body}${note}\n`,
            )
          '
          __PM_AUDIT__ || true

      # Layer 2: blocking, pull requests only. Diffs the PR's base against its head, so it only ever objects to dependencies the PR itself introduces, never pre-existing ones.
      # Free on public repos but needs GitHub Advanced Security on private ones; can't run on `push`, so a private repo or a push without an open PR has no blocking gate.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      # Talks to a SonarQube server this repo can't provide, so it stays skipped unless `vars.SONAR_HOST_URL` is configured.
      # Lint, typecheck, test and the audit above still give a fork a meaningful run with zero setup.
      - name: SonarQube Scan
        if: vars.SONAR_HOST_URL != ''
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          skipSignatureVerification: true
          args: >
            -Dsonar.projectKey=${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
