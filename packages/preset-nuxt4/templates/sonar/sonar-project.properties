# SonarQube config. Only the static keys live here; host.url, token, projectKey and projectName
# are supplied by .github/workflows/lint-test-sonarqube.yml so no secret is committed.

sonar.sources=app,server,modules
sonar.tests=test
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts
sonar.sourceEncoding=UTF-8

# Excluded from coverage so the percentage tracks real logic, not untested templates and UI.
sonar.coverage.exclusions=app/pages/**,app/layouts/**,app/components/**,app/types/**,app/utils/auto-import-icons.ts,modules/**

# Keep generated/build output out of analysis entirely.
sonar.exclusions=app/utils/auto-import-icons.ts,app/types/**,.output/**,.nuxt/**,node_modules/**,coverage/**,dependencycheck/**

# Coverage (vitest lcov). `javascript.lcov` is the canonical key (covers TS too).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# No `sonar.dependencyCheck.*` keys on purpose: scanning moved to `pnpm audit` and `dependency-review-action`, neither of
# which writes an OWASP report, and aiming Sonar at a report nothing generates silently reports nothing. Re-add if you run OWASP yourself.
